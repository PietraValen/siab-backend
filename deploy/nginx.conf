# Alternativa ao Caddyfile para quem já usa nginx (seção 4.2 do roteiro em
# docs/seguranca.md). Requer nginx compilado contra OpenSSL >= 3.5 — é a
# versão que traz o grupo híbrido X25519MLKEM768. Confira com: nginx -V
#
# Este arquivo é um bloco "server" para incluir dentro de "http { ... }".

server {
    listen 443 ssl;
    http2 on;
    server_name siab.exemplo.com.br;

    ssl_certificate     /etc/ssl/siab/fullchain.pem;
    ssl_certificate_key /etc/ssl/siab/privkey.pem;

    ssl_protocols TLSv1.3;
    # Híbrido pós-quântico primeiro; X25519 puro para clientes antigos.
    ssl_ecdh_curve X25519MLKEM768:X25519;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 10m;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 80;
    server_name siab.exemplo.com.br;
    return 301 https://$host$request_uri;
}
