siab.crypto.chaves-efemeras=true
siab.auditoria.selagem-automatica=false
# O limite por IP tem teste próprio (RateLimitFilterTest); aqui todos os testes saem do mesmo IP.
siab.rate-limit.login-por-minuto=100000
siab.rate-limit.reconhecimento-por-minuto=100000
# Sem valor padrão no application.yml (JwtService#validarSegredo); só para os testes.
siab.security.jwt-secret=segredo-so-para-os-testes-com-pelo-menos-32-bytes
siab.biometria.retencao-cron=-
